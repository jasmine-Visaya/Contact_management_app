name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # 3.5. Create .env file for Vite/Vue
      # ----------------------------------------------------------
      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_IMAGEKIT_PUBLIC_KEY=${{ secrets.VITE_IMAGEKIT_PUBLIC_KEY }}" >> .env
          echo "VITE_IMAGEKIT_URL_ENDPOINT=${{ secrets.VITE_IMAGEKIT_URL_ENDPOINT }}" >> .env
          echo "VITE_IMAGEKIT_AUTH_ENDPOINT=${{ secrets.VITE_IMAGEKIT_AUTH_ENDPOINT }}" >> .env
          echo "IMAGEKIT_PUBLIC_KEY=${{ secrets.IMAGEKIT_PUBLIC_KEY }}" >> .env
          echo "IMAGEKIT_PRIVATE_KEY=${{ secrets.IMAGEKIT_PRIVATE_KEY }}" >> .env
          echo "IMAGEKIT_URL_ENDPOINT=${{ secrets.IMAGEKIT_URL_ENDPOINT }}" >> .env

      # ----------------------------------------------------------
      # 3.6. Restore google-services.json for Firebase Android
      # ----------------------------------------------------------
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # 4. Build Ionic/Vue application
      - name: Build Ionic application
        run: npm run build

      # 5. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Confirm Java version
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 7. Synchronize Capacitor with Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Give Gradle execution permission
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 9. Check Gradle environment
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # 10. Build debug APK
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Rename the generated APK
      - name: Rename APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ContactManager.apk

      # 12. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Contact Manager
          path: ContactManager.apk
          if-no-files-found: error
          retention-days: 30